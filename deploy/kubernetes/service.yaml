apiVersion: v1
kind: Service
metadata:
  name: lorekeeper
  namespace: lorekeeper
  labels:
    app: lorekeeper
spec:
  # ClusterIP for kubectl port-forward access. For direct LAN access instead,
  # change the type to NodePort (optionally pinning a nodePort in 30000-32767).
  type: ClusterIP
  selector:
    app: lorekeeper
  ports:
    - name: http
      port: 80
      targetPort: http
