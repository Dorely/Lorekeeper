# Durable storage for the SQLite database, its protected migration backups, and
# the Data Protection keys. Bound to the node-local PersistentVolume defined by
# your pv.yaml (copied from pv.example.yaml); snapshot or back up that storage
# to back up Lorekeeper.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lorekeeper-data
  namespace: lorekeeper
spec:
  storageClassName: local-storage
  volumeName: lorekeeper-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
