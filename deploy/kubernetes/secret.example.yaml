# Copy to secret.yaml (never commit it) and fill in the values printed by:
#   docker run --rm lorekeeper:<tag> auth-setup --username <name> --password '<password>'
# The password itself is never stored; add the printed otpauth:// URI to an
# authenticator app before the first sign-in.
apiVersion: v1
kind: Secret
metadata:
  name: lorekeeper-auth
  namespace: lorekeeper
type: Opaque
stringData:
  Auth__SingleUser__Username: "REPLACE_ME"
  Auth__SingleUser__PasswordHash: "REPLACE_ME"
  Auth__SingleUser__TotpSecret: "REPLACE_ME"
