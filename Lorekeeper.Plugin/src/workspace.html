<!doctype html>
<html lang="en" data-lk-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lorekeeper Local</title><style>

*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;background:var(--lk-canvas);color:var(--lk-ink);overflow:hidden}
body{display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}button{background:var(--lk-surface);border:1px solid var(--lk-line-strong);border-radius:var(--lk-radius-sm);padding:6px 10px;min-height:34px;cursor:pointer;font-weight:600}button:hover:not(:disabled){background:var(--lk-soft);border-color:var(--lk-accent)}button:disabled{opacity:.5;cursor:default}button.active,button.primary{color:var(--lk-accent);background:var(--lk-accent-soft);border-color:var(--lk-accent-border)}
input,select,textarea{background:var(--lk-canvas-inset);border:1px solid var(--lk-line-strong);border-radius:var(--lk-radius-sm);padding:7px 9px;width:100%}textarea{resize:vertical;min-height:76px;line-height:1.6}input[type=checkbox]{width:auto}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lk-accent);outline-offset:2px}
h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:10px 0}p{margin:6px 0 14px}small,.muted{color:var(--lk-muted);font-size:12px}label{display:block;font-size:12px;color:var(--lk-muted);margin:9px 0 4px}a{color:var(--lk-accent)}[hidden]{display:none!important}
header{height:56px;padding:8px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--lk-line);background:var(--lk-surface)}.brand{font-size:18px;font-weight:750;white-space:nowrap}.row{display:flex;gap:7px;align-items:center}.row.wrap{flex-wrap:wrap}.row>*{min-width:0}.row>input{flex:1;width:0;min-width:80px}.row>.actions{flex-shrink:0}.row>label{flex-shrink:0;max-width:60px}.grow{flex:1}header select{width:180px}#save-state{font-size:12px;color:var(--lk-muted);white-space:nowrap}#status{min-height:24px;margin:0;padding:2px 16px;background:var(--lk-soft);color:var(--lk-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status[data-error=true]{background:var(--lk-danger-soft);color:var(--lk-danger)}#layout{height:calc(100dvh - 80px);display:grid;grid-template-columns:var(--chat-width,330px) 6px minmax(300px,1fr) 6px var(--details-width,330px)}
header,#status,#mobile-nav{flex-shrink:0}#layout{flex:1;min-height:0}
.pane{min-width:0;min-height:0;background:var(--lk-surface);overflow:auto}.pane-title{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--lk-line);padding:10px 14px;min-height:44px;background:var(--lk-soft)}.pane-title h2{margin:0}.pane-body{padding:14px}.resizer{background:var(--lk-canvas);cursor:col-resize;touch-action:none}.resizer:hover,.resizer:focus-visible{background:var(--lk-accent)}#chat-pane{display:flex;flex-direction:column;overflow:hidden}#chat-pane .pane-body{display:flex;flex:1;min-height:0;flex-direction:column;gap:8px;padding:12px}#chat-transcript{flex:1;min-height:80px;overflow:auto;overflow-wrap:anywhere;padding:4px}#chat-message{resize:vertical;min-height:72px;max-height:220px}#chat-status{font-size:12px;color:var(--lk-muted)}.chat-turn{margin:12px 0 18px}.chat-message.user{background:var(--lk-soft);border:1px solid var(--lk-line);padding:10px;border-radius:var(--lk-radius-md);white-space:pre-wrap}.chat-message.assistant{padding:10px 2px;line-height:1.65}.chat-message p{margin:4px 0 12px}.chat-message pre{background:var(--lk-soft);padding:10px;overflow:auto}.chat-message code{font-size:12px;white-space:pre-wrap}.chat-turn details{font-size:12px;color:var(--lk-muted);margin:7px 0}.chat-turn details pre{white-space:pre-wrap;max-height:180px;overflow:auto}.chat-models{display:grid;grid-template-columns:minmax(0,2fr) minmax(80px,1fr);gap:6px}.chat-error{color:var(--lk-danger);font-size:12px}.card{border:1px solid var(--lk-line);border-radius:var(--lk-radius-md);padding:12px;background:var(--lk-surface);margin:10px 0}.card.selected{border-color:var(--lk-accent);background:var(--lk-accent-soft)}.act{border-left:3px solid var(--lk-accent);padding-left:14px;margin:14px 0 24px}.chapter{border-left:2px solid var(--lk-line-strong);padding-left:12px;margin:12px 0}.beat{border-top:1px solid var(--lk-line);padding:10px 0 4px;margin-left:20px}.inline-title{font-weight:650;font-size:15px;border-color:transparent;background:transparent;padding-left:3px}.actions{display:flex;gap:4px;align-items:center}.actions button{padding:4px 8px;font-size:12px}.handle{cursor:grab;color:var(--lk-muted);touch-action:manipulation}.empty{padding:30px 16px;color:var(--lk-muted)}details>summary{cursor:pointer;padding:5px 0;font-weight:600}details.panel{border-bottom:1px solid var(--lk-line);padding:10px 14px}.entity-list{max-height:250px;overflow:auto}.entity-row{display:flex;gap:5px;margin:4px 0}.entity-row button{flex:1;text-align:left;border-color:transparent;font-weight:400}.entity-row button:hover{border-color:var(--lk-line)}.check{display:flex;align-items:center;gap:7px;font-size:12px;margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:2px 7px;background:var(--lk-soft);border-radius:15px;border:1px solid var(--lk-line);font-size:11px}.editor-layout{height:100%;display:grid;grid-template-columns:150px minmax(0,1fr)}.chapter-nav{padding:10px;border-right:1px solid var(--lk-line);overflow:auto}.chapter-nav button{width:100%;text-align:left;font-weight:400;margin:3px 0;border-color:transparent}.editor-content{min-width:0;display:flex;flex-direction:column;padding:16px;overflow:hidden}.editor-toolbar{margin:12px 0}.manuscript{flex:1;resize:none;min-height:180px;font:17px/1.9 Georgia,"Times New Roman",serif;padding:22px;background:var(--lk-canvas-inset)}.reading{white-space:pre-wrap;overflow:auto;flex:1;padding:22px;font:17px/1.9 Georgia,"Times New Roman",serif}.format-placeholder{font-size:12px;color:var(--lk-muted);padding:6px 0;border-bottom:1px solid var(--lk-line)}.source{padding:10px 0;border-bottom:1px solid var(--lk-line)}.source button.title{border:0;padding:0;text-align:left;background:none;min-height:25px}.source small{display:block}.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}.diff pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;border:1px solid var(--lk-line);padding:12px;font-size:12px}.badge{color:var(--lk-accent);font-size:11px}.danger{color:var(--lk-danger)}dialog{width:min(780px,95vw);max-height:90vh;overflow:auto;border:1px solid var(--lk-line-strong);border-radius:var(--lk-radius-lg);background:var(--lk-surface);color:var(--lk-ink);box-shadow:var(--lk-shadow-md);padding:22px}dialog::backdrop{background:var(--lk-backdrop)}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere}dialog .actions{justify-content:flex-end;margin-top:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#mobile-nav{display:none}body[data-chat-collapsed=true] #layout{grid-template-columns:0 6px minmax(300px,1fr) 6px var(--details-width,330px)}body[data-details-collapsed=true] #layout{grid-template-columns:var(--chat-width,330px) 6px minmax(300px,1fr) 6px 0}body[data-chat-collapsed=true][data-details-collapsed=true] #layout{grid-template-columns:0 6px minmax(300px,1fr) 6px 0}
@media(max-width:1050px){header{gap:6px;padding:8px}header .brand{font-size:16px}header select{width:140px}#layout{height:calc(100dvh - 130px);display:block!important}.pane{height:100%}.resizer{display:none}body[data-pane=chat] #workspace-pane,body[data-pane=chat] #details-pane,body[data-pane=workspace] #chat-pane,body[data-pane=workspace] #details-pane,body[data-pane=details] #chat-pane,body[data-pane=details] #workspace-pane{display:none!important}#mobile-nav{height:50px;display:flex;border-top:1px solid var(--lk-line);background:var(--lk-surface);padding:4px;gap:4px}#mobile-nav button{flex:1;min-height:40px}button{min-height:40px}.desktop-only{display:none!important}.editor-layout{grid-template-columns:110px minmax(0,1fr)}.editor-content{padding:12px}.manuscript{padding:14px}.diff{grid-template-columns:1fr}}
@media(max-width:560px){header{height:auto;min-height:96px;flex-wrap:wrap}header select{flex:1}#layout{height:auto}.brand{flex:1}#save-state{flex:1}.editor-layout{display:flex;flex-direction:column}.chapter-nav{max-height:100px;border-right:0;border-bottom:1px solid var(--lk-line);display:flex;gap:5px;flex-shrink:0}.chapter-nav button{min-width:100px;width:auto}.editor-content{flex:1}#plugin-version{display:none}.actions{flex-wrap:wrap}.act>.row,.chapter>.row,.beat>.row{flex-wrap:wrap}}
</style></head><body data-pane="workspace">
<header><span class="brand">Lorekeeper</span><span id="plugin-version" class="badge"></span><label class="sr-only" for="project-list">Project</label><select id="project-list"><option>Connecting…</option></select><button id="new">New</button><button data-surface="outline" class="active">Outline</button><button data-surface="editor">Editor</button><span class="grow"></span><span id="save-state" role="button" tabindex="0" title="Save status; activate to retry or resolve a retained draft">Connecting…</span><button id="history">Changes / History</button><button id="theme" aria-label="Toggle light and dark theme">◐</button><button id="settings" aria-label="Connection and layout settings">Settings</button></header>
<p id="status" role="status" aria-live="polite">Connecting to local project files…</p>
<div id="layout"><section class="pane" id="chat-pane" aria-label="Chat"></section><div class="resizer" id="chat-resizer" role="separator" aria-orientation="vertical" aria-label="Chat width" tabindex="0"></div><section class="pane" id="workspace-pane" aria-label="Writing workspace"></section><div class="resizer" id="details-resizer" role="separator" aria-orientation="vertical" aria-label="Details width" tabindex="0"></div><section class="pane" id="details-pane" aria-label="Details and active context"></section></div>

<dialog id="dialog"><div id="dialog-content"></div></dialog><script type="module">/*APP_SCRIPT*/</script></body></html>
