[package]
name = "lorekeeper-press"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lopdf = { version = "=0.44.0", default-features = false }
moxcms = { version = "=0.9.0", default-features = false, features = ["lut"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
