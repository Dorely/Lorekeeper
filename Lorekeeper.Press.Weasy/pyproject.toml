[project]
name = "lorekeeper-press-weasy"
version = "0.2.0"
description = "Contained deterministic PDF renderer for Lorekeeper publication previews"
requires-python = ">=3.13,<3.15"
dependencies = [
    "cffi==2.0.0",
    "pillow==12.3.0",
    "pypdf==6.14.2",
    "weasyprint==69.0",
]

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
]

[project.scripts]
lorekeeper-press-weasy = "lorekeeper_press_weasy.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorekeeper_press_weasy"]
