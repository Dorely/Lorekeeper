name: Build macOS release
run-name: macOS ${{ inputs.version }} (${{ inputs.correlation_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version
        required: true
        type: string
      source_commit:
        description: Exact Lorekeeper source commit
        required: true
        type: string
      correlation_id:
        description: Unique orchestration identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build osx-arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Verify source commit
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Build and verify DMG
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-macos-release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ inputs.correlation_id }}-arm64
          path: publish/osx-arm64/Lorekeeper-${{ inputs.version }}-arm64.dmg
          if-no-files-found: error
          retention-days: 1
