name: Pull request validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Build solution
        run: dotnet build Lorekeeper.sln

      - name: Run migration and import tests
        run: dotnet test Lorekeeper.Tests/Lorekeeper.Tests.csproj

      - name: Check Press formatting
        working-directory: Lorekeeper.Press
        run: cargo fmt --check

      - name: Lint Press targets
        working-directory: Lorekeeper.Press
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Press conformance tests
        working-directory: Lorekeeper.Press
        run: cargo test --locked
